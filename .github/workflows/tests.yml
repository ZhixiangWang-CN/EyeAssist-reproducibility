name: reproducibility-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic end-to-end analysis
        run: python examples/synthetic_demo.py --output outputs/ci-demo
      - name: GazeVaLM data-free analysis tests
        run: python external/gazevalm/test_synthetic.py
